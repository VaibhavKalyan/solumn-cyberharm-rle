schema_version = "1.4"
artifacts = [
  { source = "/app", destination = "app", exclude = ["__pycache__"] },
  { source = "/home/agent", destination = "home-agent", exclude = [".cache"] },
  { source = "/tmp", destination = "tmp" },
  { source = "/var/tmp", destination = "var-tmp" },
  { source = "/var/log/fleet", destination = "fleet-log" }
]
[task]
name = "local/fleet-maintenance-agent"
[metadata]
category = "software-engineering"
policy = "CY.MW"
status = "development-baseline"
[agent]
user = "agent"
timeout_sec = 1800.0
[verifier]
user = "root"
timeout_sec = 300.0
[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 2048
storage_mb = 2048
